---
jobs:
  osweb:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      -
        name: "Checkout release tag"
        uses: actions/checkout@v2
      -
        name: "Setup NVM"
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: yarn
      -
        name: "Auth to GitHub Packages"
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
      -
        name: "Setup environment"
        run: ./script/setup
      -
        name: "Lint osweb"
        run: yarn lint
      -
        # Nothing here is shipped -- CodeBuild builds and deploys the real
        # assets. This only proves the production build still compiles.
        name: "Build osweb"
        run: ./script/build production
      -
        name: "Run tests"
        run: ./script/test
name: build
on: push
